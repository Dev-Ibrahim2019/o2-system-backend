        </div>
        <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
          <button style={{ display:"flex", alignItems:"center", gap:6, padding:"9px 14px", borderRadius:radius.lg, background:colors.semantic.successBg, border:`1px solid ${colors.semantic.successBorder}`, color:colors.semantic.success, fontSize:13, fontWeight:600 }}>+ إضافة صنف</button>
          <button style={{ display:"flex", alignItems:"center", gap:6, padding:"9px 14px", borderRadius:radius.lg, background:`${colors.brand[500]}0c`, border:`1px solid ${colors.brand[500]}25`, color:colors.brand[600], fontSize:13, fontWeight:600 }}>✎ تعديل</button>
          <button style={{ display:"flex", alignItems:"center", gap:6, padding:"9px 14px", borderRadius:radius.lg, background:colors.semantic.errorBg, border:`1px solid ${colors.semantic.errorBorder}`, color:colors.semantic.error, fontSize:13, fontWeight:600 }}>✕ إلغاء الطلب</button>
        </div>
      </div>

      <div style={{ background:colors.neutral[0], border:`1px solid ${colors.border.subtle}`, borderRadius:radius.xl, padding:"18px 24px", marginBottom:18, boxShadow:shadows.xs }}>
        <Stepper />
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"1fr 340px", gap:20 }}>
        <div style={{ background:colors.neutral[0], borderRadius:radius.xl, border:`1px solid ${colors.border.subtle}`, overflow:"hidden", boxShadow:shadows.xs }}>
          <div style={{ padding:"13px 20px", borderBottom:`1px solid ${colors.border.subtle}`, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <h2 style={{ margin:0, display:"flex", alignItems:"center", gap:8, fontSize:16, fontWeight:700, color:colors.neutral[900] }}>
              📦 أصناف الطلب <span style={{ fontSize:11, fontWeight:700, color:colors.neutral[500], background:colors.neutral[100], padding:"1px 8px", borderRadius:radius.full }}>{items.length}</span>
            </h2>
            <button style={{ display:"flex", alignItems:"center", gap:4, padding:"5px 11px", borderRadius:radius.md, background:colors.semantic.successBg, border:`1px solid ${colors.semantic.successBorder}`, color:colors.semantic.success, fontSize:11, fontWeight:600 }}>+ إضافة</button>
          </div>
          {items.map((it,i) => (
            <div key={i} style={{ display:"flex", alignItems:"center", gap:12, padding:"13px 20px", borderBottom: i<items.length-1?`1px solid ${colors.border.subtle}`:"none" }}>
              <span style={{ width:30, height:30, borderRadius:radius.md, background:`${it.deptColor}15`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:12, fontWeight:700, color:it.deptColor, flexShrink:0 }}>{it.qty}×</span>
              <div style={{ flex:1, minWidth:0 }}>
                <p style={{ margin:0, fontSize:13, fontWeight:600, color:colors.neutral[800] }}>{it.name}</p>
                <div style={{ display:"flex", alignItems:"center", gap:6, marginTop:3 }}>
                  <span style={{ fontSize:10, color:colors.neutral[400] }}>{it.dept}</span>
                  {it.notes && <span style={{ display:"inline-flex", alignItems:"center", gap:3, fontSize:11, color:colors.neutral[500], background:colors.neutral[50], padding:"1px 7px", borderRadius:radius.full }}>📝 {it.notes}</span>}
                </div>
              </div>
              <span style={{ fontSize:12, color:colors.neutral[500] }}>{it.price.toFixed(2)} د.إ</span>
              <span style={{ fontSize:13, fontWeight:700, color:colors.neutral[900], minWidth:80, textAlign:"left" }}>{(it.price*it.qty).toFixed(2)} د.إ</span>
              <button style={{ width:28, height:28, borderRadius:radius.md, background:colors.semantic.errorBg, border:`1px solid ${colors.semantic.errorBorder}`, display:"flex", alignItems:"center", justifyContent:"center", color:colors.semantic.error, flexShrink:0 }}>🗑</button>
            </div>
          ))}
        </div>

        <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
          <SectionCard title="بيانات العميل" icon="👤">
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14 }}>
              <div style={{ width:36, height:36, borderRadius:"50%", background:"rgba(226,0,4,.15)", color:colors.brand[500], display:"flex", alignItems:"center", justifyContent:"center", fontWeight:700, fontSize:13 }}>سم</div>
              <div>
                <p style={{ margin:0, fontSize:13, fontWeight:700, color:colors.neutral[900] }}>سامر محمود</p>
                <p style={{ margin:0, fontSize:11, color:colors.neutral[400] }}>استلمه أحمد خالد</p>
              </div>
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
              <div style={{ display:"flex", alignItems:"center", gap:9 }}>
                <span style={{ width:26, height:26, borderRadius:radius.md, background:colors.neutral[100], display:"flex", alignItems:"center", justifyContent:"center", color:colors.neutral[500] }}>📞</span>
                <span style={{ flex:1, fontSize:13, color:colors.neutral[700] }}>0501234567</span>
                <span style={{ display:"flex", gap:4 }}>
                  <span style={{ width:24, height:24, borderRadius:radius.md, display:"flex", alignItems:"center", justifyContent:"center", color:colors.semantic.success, background:colors.semantic.successBg }}>📲</span>
                  <span style={{ width:24, height:24, borderRadius:radius.md, display:"flex", alignItems:"center", justifyContent:"center", color:colors.neutral[500], background:colors.neutral[100] }}>⧉</span>
                </span>
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:9 }}>
                <span style={{ width:26, height:26, borderRadius:radius.md, background:colors.neutral[100], display:"flex", alignItems:"center", justifyContent:"center", color:colors.neutral[500] }}>🏢</span>
                <span style={{ fontSize:13, color:colors.neutral[700] }}>فرع الرياض - العليا</span>
              </div>
            </div>
          </SectionCard>

          <SectionCard title="ملاحظات" icon="📝">
            <p style={{ margin:0, fontSize:13, color:colors.neutral[700] }}>يرجى عدم وضع صلصة الثوم، والاتصال قبل الوصول.</p>
          </SectionCard>

          <SectionCard title="ملخص المبلغ" icon="🧾">
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:13 }}><span style={{ color:colors.neutral[500] }}>المجموع الفرعي</span><span style={{ fontWeight:600, color:colors.neutral[800] }}>96.00 د.إ</span></div>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:13 }}><span style={{ color:colors.semantic.error }}>الخصم</span><span style={{ fontWeight:600, color:colors.semantic.error }}>-10.00 د.إ</span></div>
              <div style={{ borderTop:`1px solid ${colors.border.subtle}`, paddingTop:10, display:"flex", justifyContent:"space-between", alignItems:"baseline" }}>
                <span style={{ fontSize:14, fontWeight:700, color:colors.neutral[900] }}>الإجمالي</span>
                <span style={{ fontSize:22, fontWeight:800, color:colors.brand[600] }}>86.00 د.إ</span>
              </div>
            </div>
          </SectionCard>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>


</body></html>
